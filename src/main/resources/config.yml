# Soul Link Plugin Configuration
# This file is automatically generated and managed by the plugin
# Manual changes will be overwritten

# Game Settings
natural-regeneration: true
last-chance-count: 1
locate-bar-enabled: true

# Show health bars (hearts) for all players in the TAB list
show-health-bars: true

# Make linked players glow (visible through walls) for each other
linked-player-glow: true

# Maximum number of linked players
max-players: 4
